name: CI/CD Android - Ecommerce

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write   

jobs:
  ci:
    name: CI - Build e Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permissão de execução ao gradlew
        run: chmod +x gradlew

      - name: Rodar testes unitários
        run: ./gradlew testDebugUnitTest

      - name: Gerar APK
        run: ./gradlew assembleDebug

      - name: Salvar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  cd:
    name: CD - Publicar Release
    needs: ci                      
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar APK gerado na CI
        uses: actions/download-artifact@v4
        with:
          name: app-debug

      - name: Criar GitHub Release com o APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ecommerce v1.0.${{ github.run_number }}
          body: "Build automático do commit ${{ github.sha }}"
          files: app-debug.apk
